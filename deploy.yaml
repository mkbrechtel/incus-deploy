---

- name: Netplan role
  hosts: all
  order: shuffle
  gather_facts: yes
  gather_subset:
    - "distribution_release"
  role:
    - netplan

- name: Environment role
  hosts: all
  order: shuffle
  gather_facts: yes
  gather_subset:
    - "distribution_release"
  role:
    - environment

- name: NVMe role
  hosts: all
  order: shuffle
  gather_facts: yes
  gather_subset:
    - "distribution_release"
  role:
    - nvme

- name: Ceph role
  hosts: all
  order: shuffle
  gather_facts: yes
  gather_subset:
    - "distribution_release"
  role:
    - ceph
    
- name: LVM Cluster role
  hosts: all
  order: shuffle
  gather_facts: yes
  gather_subset:
    - "distribution_release"
    - "default_ipv4"
    - "default_ipv6"
  role:
    - lvmcluster

- name: OVN role
  hosts: all
  order: shuffle
  gather_facts: yes
  gather_subset:
    - "distribution_release"
    - "default_ipv4"
    - "default_ipv6"
  role:
    - ovn

- name: Incus role
  hosts: all
  order: shuffle
  gather_facts: yes
  gather_subset:
    - "distribution_release"
    - "default_ipv4"
    - "default_ipv6"

  role:
    - incus
